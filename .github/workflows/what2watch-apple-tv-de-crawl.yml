name: what2watch Apple TV DE full crawl
# Manual full recrawl + immediate validation requested 2026-09-02

on:
  push:
    branches: [what2watch-netflix-crawl]
    paths:
      - ".github/scripts/apple_tv_de_crawl.py"
      - ".github/workflows/what2watch-apple-tv-de-crawl.yml"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Crawl complete Apple TV DE subscription catalog
        run: python .github/scripts/apple_tv_de_crawl.py
      - name: Verify report completeness
        run: |
          python - <<'PY'
          import json
          r=json.load(open('out-apple-tv/apple-tv-de-crawl-report.json',encoding='utf-8'))
          assert r['coverage_complete'] is True, r
          assert r['reported_total'] >= 200
          assert r['enumerated_unique']==r['reported_total']==r['verified']
          assert r['rejected']==0
          assert not r['errors']
          print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple-tv-de-full-crawl
          path: |
            out-apple-tv/apple-tv-de-catalog.json
            out-apple-tv/apple-tv-de-crawl-report.json
          if-no-files-found: error
          retention-days: 7
