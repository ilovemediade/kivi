name: what2watch Disney FAST SAFE SQL test

on:
  push:
    branches: [what2watch-netflix-crawl]
    paths:
      - ".github/scripts/build_disney_fast_safe_sql.py"
      - ".github/workflows/what2watch-disney-sql-test.yml"
  workflow_dispatch:

jobs:
  mariadb-three-provider-import:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: w2w
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

      - name: Download verified Netflix Prime and Disney crawl artifacts
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9815654535/zip > /tmp/netflix.zip
          mkdir -p /tmp/netflix && unzip -q /tmp/netflix.zip -d /tmp/netflix
          gh api repos/${{ github.repository }}/actions/artifacts/9835252384/zip > /tmp/prime.zip
          mkdir -p /tmp/prime && unzip -q /tmp/prime.zip -d /tmp/prime
          gh api repos/${{ github.repository }}/actions/artifacts/9836196033/zip > /tmp/disney.zip
          mkdir -p /tmp/disney && unzip -q /tmp/disney.zip -d /tmp/disney
          test -s /tmp/netflix/netflix-de-catalog.json
          test -s /tmp/prime/prime-de-catalog.json
          test -s /tmp/disney/disney-de-catalog.json

      - name: Generate three SQL imports and verify catalog overlaps
        run: |
          python .github/scripts/build_netflix_fast_safe_sql.py /tmp/netflix/netflix-de-catalog.json /tmp/netflix.sql
          python .github/scripts/build_prime_fast_safe_sql.py /tmp/prime/prime-de-catalog.json /tmp/prime.sql
          python .github/scripts/build_disney_fast_safe_sql.py /tmp/disney/disney-de-catalog.json /tmp/disney.sql
          python - <<'PY'
          import json
          n=json.load(open('/tmp/netflix/netflix-de-catalog.json',encoding='utf-8'))['records']
          p=json.load(open('/tmp/prime/prime-de-catalog.json',encoding='utf-8'))['records']
          d=json.load(open('/tmp/disney/disney-de-catalog.json',encoding='utf-8'))['records']
          ni={x['justwatch_id'] for x in n}; pi={x['justwatch_id'] for x in p}; di={x['justwatch_id'] for x in d}
          assert (len(ni),len(pi),len(di))==(8397,9016,3545)
          assert len(ni & pi)==209
          assert len(ni & di)==400
          assert len(pi & di)==134
          assert len(ni & pi & di)==57
          assert len(di & (ni|pi))==477
          assert len(ni|pi|di)==20272
          print({'netflix':len(ni),'prime':len(pi),'disney':len(di),'np':len(ni&pi),'nd':len(ni&di),'pd':len(pi&di),'triple':len(ni&pi&di),'disney_existing':len(di&(ni|pi)),'canonical_union':len(ni|pi|di)})
          PY

      - name: Create what2watch schema
        run: mariadb -h127.0.0.1 -P3306 -uroot -proot w2w < .github/sqltest/w2w-schema.sql

      - name: Import Netflix and Prime baseline
        run: |
          mariadb -h127.0.0.1 -P3306 -uroot -proot w2w < /tmp/netflix.sql > /tmp/netflix.out
          mariadb -h127.0.0.1 -P3306 -uroot -proot w2w < /tmp/prime.sql > /tmp/prime.out

      - name: Assert two-provider baseline
        run: |
          q() { mariadb -N -B -h127.0.0.1 -P3306 -uroot -proot w2w -e "$1"; }
          test "$(q "SELECT COUNT(*) FROM media;")" = "17204"
          test "$(q "SELECT COUNT(*) FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug='netflix' AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL;")" = "8397"
          test "$(q "SELECT COUNT(*) FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug='prime' AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL;")" = "9016"

      - name: Import complete Disney snapshot - first run
        run: |
          start=$(date +%s)
          mariadb -h127.0.0.1 -P3306 -uroot -proot w2w < /tmp/disney.sql > /tmp/disney1.out 2> /tmp/disney1.err
          end=$(date +%s)
          echo "disney_first_import_seconds=$((end-start))"
          cat /tmp/disney1.out
          cat /tmp/disney1.err
          ! grep -E "ERROR|Warning \(Code 1062\)" /tmp/disney1.err
          grep -Pq '^3545\t3545\t3545\t3545\t3068\t477\t0$' /tmp/disney1.out

      - name: Assert first Disney import and three-provider dedupe
        run: |
          q() { mariadb -N -B -h127.0.0.1 -P3306 -uroot -proot w2w -e "$1"; }
          test "$(q "SELECT COUNT(*) FROM media;")" = "20272"
          test "$(q "SELECT COUNT(*) FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug='disney' AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL;")" = "3545"
          test "$(q "SELECT COUNT(*) FROM media_source_records WHERE source='justwatch-disney-plus-de' AND status='active';")" = "3545"
          test "$(q "SELECT COUNT(*) FROM media_external_ids WHERE source='justwatch-node';")" = "20272"
          test "$(q "SELECT COUNT(*) FROM (SELECT a.media_id FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug IN ('netflix','disney') AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL GROUP BY a.media_id HAVING COUNT(DISTINCT p.slug)=2) x;")" = "400"
          test "$(q "SELECT COUNT(*) FROM (SELECT a.media_id FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug IN ('prime','disney') AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL GROUP BY a.media_id HAVING COUNT(DISTINCT p.slug)=2) x;")" = "134"
          test "$(q "SELECT COUNT(*) FROM (SELECT a.media_id FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug IN ('netflix','prime','disney') AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL GROUP BY a.media_id HAVING COUNT(DISTINCT p.slug)=3) x;")" = "57"
          test "$(q "SELECT external_id FROM provider_external_ids pei JOIN providers p ON p.id=pei.provider_id WHERE p.slug='disney' AND pei.source='justwatch';")" = "dnp"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='w2w' AND table_name='w2w_dnp_20260902_stage';")" = "0"

      - name: Import Disney snapshot again - idempotency run
        run: |
          start=$(date +%s)
          mariadb -h127.0.0.1 -P3306 -uroot -proot w2w < /tmp/disney.sql > /tmp/disney2.out 2> /tmp/disney2.err
          end=$(date +%s)
          echo "disney_second_import_seconds=$((end-start))"
          cat /tmp/disney2.out
          cat /tmp/disney2.err
          ! grep -E "ERROR|Warning \(Code 1062\)" /tmp/disney2.err
          grep -Pq '^3545\t3545\t3545\t3545\t0\t3545\t0$' /tmp/disney2.out

      - name: Assert Disney idempotency
        run: |
          q() { mariadb -N -B -h127.0.0.1 -P3306 -uroot -proot w2w -e "$1"; }
          test "$(q "SELECT COUNT(*) FROM media;")" = "20272"
          test "$(q "SELECT COUNT(*) FROM media_availability a JOIN providers p ON p.id=a.provider_id WHERE p.slug='disney' AND a.country_code='DE' AND a.offer_type='subscription' AND a.removed_at IS NULL;")" = "3545"
          test "$(q "SELECT COUNT(*) FROM media_source_records WHERE source='justwatch-disney-plus-de' AND status='active';")" = "3545"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='w2w' AND table_name='w2w_dnp_20260902_stage';")" = "0"
